name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore binary assets (stored as base64 text)
        run: |
          mkdir -p public
          base64 -d assets-b64/ahmed-1.jpg.b64 > public/ahmed-1.jpg
          base64 -d assets-b64/favicon.ico.b64 > public/favicon.ico
      - run: npm install
      - run: npx ng build --base-href /portfolio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
